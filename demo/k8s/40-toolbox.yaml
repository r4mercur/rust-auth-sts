apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: auth-demo
  labels:
    app: toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toolbox
  template:
    metadata:
      labels:
        app: toolbox
        auth-demo/inventory-client: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command: ["sleep", "infinity"]
          env:
            - name: REPORTING_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reporting-sts-credentials
                  key: client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
