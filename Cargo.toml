[package]
name = "rust-auth-sts"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
time = "0.3.41"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"]}
thiserror = "2.0.15"
anyhow = "1.0.99"

jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
uuid = { version = "1.18.0", features = ["v4"] }

rsa = { version = "0.9.8", features = ["pem"]}
pkcs8 = "0.11.0"
pem = "3.0.5"
base64ct = { version = "=1.6.0", features = ["alloc"] }

dotenvy = "0.15.7"
tower-http = { version = "0.6.6", features = ["trace", "cors", "compression-full"]}
argon2 = { version = "0.5", features = ["std"] }
percent-encoding = "2.3.2"

[dev-dependencies]
tower = "0.5.3"
http-body-util = "0.1.3"
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }

# Argon2 ist unoptimiert sehr langsam (~0.7s pro Hash) – auch im Dev-Build optimieren.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
