[package]
name = "rust-auth-sts"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
time = "0.3.41"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"]}
thiserror = "2.0.15"
anyhow = "1.0.99"

jsonwebtoken = "10.4.0"
uuid = { version = "1.18.0", features = ["v4"] }

rsa = { version = "0.9.8", features = ["pem"]}
pkcs8 = "0.11.0"
pem = "3.0.5"
base64ct = "=1.6.0"

dotenvy = "0.15.7"
tower-http = { version = "0.6.6", features = ["trace", "cors", "compression-full"]}